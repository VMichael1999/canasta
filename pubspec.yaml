name: canasta
description: "Canasta: Lo fresco, a tu puerta - Supermercado a domicilio en Lima."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.1.0
  go_router: ^17.0.0
  get_it: ^9.3.0
  intl: ^0.19.0
  flutter_svg: ^2.2.2
  shared_preferences: ^2.5.3
  liquid_glass_widgets: ^0.18.4
  google_maps_flutter: ^2.14.0
  model_viewer_plus: ^1.9.3
  webview_flutter: ^4.13.0
  flutter_dotenv: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/illustrations/
    - assets/banners/
    - assets/products/
    - assets/icons/
    - assets/models/
    - assets/images/
    - .env
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
